name: Validate Icons

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - '**/*.json'
      - '.github/scripts/validate-icons.mjs'
      - '.github/workflows/validate-icons.yml'
  push:
    branches: [main, master, develop]
    paths:
      - '**/*.json'
      - '.github/scripts/validate-icons.mjs'
      - '.github/workflows/validate-icons.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Dep-free — runs the validator directly. No npm install so a broken
      # lockfile can't skip the security check.
      - name: Scan icon SVGs for XSS payloads
        run: node .github/scripts/validate-icons.mjs
