<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browse · KFe Icons</title>
<link rel="stylesheet" href="./assets/css/tailwind.compiled.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..0" />
</head>
<body class="flex flex-col bg-surface h-screen">

<!-- Top toolbar (matches Studio for consistency) -->
<header class="h-12 border-b ui-border flex items-center justify-between px-3 bg-surface-container-low z-20 flex-shrink-0">
  <div class="flex items-center gap-3 min-w-0">
    <div class="flex items-center gap-2 flex-shrink-0">
      <div class="w-6 h-6 bg-primary rounded flex items-center justify-center">
        <span class="text-[10px] font-bold text-white">K</span>
      </div>
      <span class="font-medium text-sm text-on-surface">KFe Icons</span>
    </div>
    <span class="text-outline">/</span>
    <span class="text-on-surface-variant text-[11px] font-mono opacity-70">browse</span>
  </div>
  <div class="flex items-center gap-3">
    <span id="stats" class="text-on-surface-variant text-[11px] font-mono opacity-60">loading…</span>
  </div>
</header>

<div class="flex flex-1 overflow-hidden min-h-0">
  <!-- Rail -->
  <aside class="w-14 border-r ui-border flex flex-col items-center py-3 gap-1 bg-surface-container-lowest z-10 flex-shrink-0">
    <a href="./index.html" class="rail-btn active" title="Browse">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">grid_view</span>
      <span class="lbl">Browse</span>
    </a>
    <a href="./studio.html" class="rail-btn" title="Studio">
      <span class="material-symbols-outlined">edit</span>
      <span class="lbl">Studio</span>
    </a>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col overflow-hidden min-w-0">
    <!-- Primary filter row -->
    <div class="flex items-center gap-2 px-4 py-2.5 border-b ui-border bg-surface-container-low flex-wrap">
      <div class="input-field rounded-lg px-3 py-1.5 flex items-center gap-2 flex-1 min-w-[220px] max-w-md">
        <span class="material-symbols-outlined text-sm text-on-surface-variant">search</span>
        <input id="search" type="search" placeholder="Filter by name…" class="flex-1 bg-transparent border-none text-[12px]" />
      </div>
      <div class="input-field rounded-lg px-3 py-1.5 flex items-center gap-2">
        <span class="material-symbols-outlined text-sm text-on-surface-variant">folder</span>
        <select id="category" class="text-[12px] font-mono min-w-[110px] bg-transparent"><option value="all">all</option></select>
      </div>
      <div class="view-toggle ml-auto" role="tablist" aria-label="View mode">
        <button id="viewGrid" class="active" title="Grid view" aria-pressed="true"><span class="material-symbols-outlined" style="font-size: 16px;">grid_view</span></button>
        <button id="viewList" title="List view" aria-pressed="false"><span class="material-symbols-outlined" style="font-size: 16px;">view_list</span></button>
      </div>
    </div>

    <!-- Display options row -->
    <div class="flex items-center gap-2 px-4 py-2 border-b ui-border bg-surface-container-lowest flex-wrap text-[11px] text-on-surface-variant">
      <div class="input-field rounded-lg px-2 py-1 flex items-center gap-2" title="Preview color">
        <span class="material-symbols-outlined text-sm">palette</span>
        <input id="color" type="color" value="#e1e1e1" class="w-6 h-6" />
      </div>
      <div class="input-field rounded-lg px-3 py-1 flex items-center gap-2" id="sizeWrap" title="Icon size">
        <span class="material-symbols-outlined text-sm">photo_size_select_actual</span>
        <input id="size" type="range" min="24" max="128" step="4" value="48" class="w-28" />
        <span id="sizeLabel" class="font-mono min-w-[24px] text-right">48</span>
      </div>
      <div class="input-field rounded-lg px-3 py-1 flex items-center gap-2" id="colsWrap" title="Columns (0 = auto-fill by size)">
        <span class="material-symbols-outlined text-sm">view_column</span>
        <input id="cols" type="number" min="0" max="24" step="1" value="0" class="w-10 font-mono text-center" />
      </div>
    </div>

    <!-- Grid -->
    <div id="grid" class="flex-1 overflow-auto p-4 view-grid cols-auto">
      <div class="col-span-full text-center text-on-surface-variant py-8">Loading…</div>
    </div>
  </main>
</div>

<!-- Detail dialog -->
<dialog id="detail" class="bg-surface-container border border-outline-variant rounded-xl p-0 text-on-surface">
  <div class="p-4 border-b ui-border flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-primary">image</span>
      <strong id="d-title" class="text-sm">icon</strong>
    </div>
    <button onclick="document.getElementById('detail').close()" class="text-on-surface-variant hover:text-on-surface p-1 rounded">
      <span class="material-symbols-outlined text-sm">close</span>
    </button>
  </div>
  <div class="p-4 space-y-3">
    <div class="dialog-preview" id="d-preview"></div>
    <div class="flex items-center justify-between">
      <span class="text-[10px] text-on-surface-variant/60 uppercase tracking-wider font-bold">SVG Markup</span>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-sm" id="d-edit">
          <span class="material-symbols-outlined text-sm">edit</span>
          Open in Studio
        </button>
        <button class="btn btn-primary btn-sm" id="d-copy">
          <span class="material-symbols-outlined text-sm">content_copy</span>
          Copy
        </button>
      </div>
    </div>
    <textarea class="code" id="d-code" readonly></textarea>
  </div>
</dialog>

<script type="module" src="./assets/js/browse.js"></script>
</body>
</html>
